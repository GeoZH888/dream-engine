# Dream Engine configuration. Every tunable number lives here (spec §0).

model: claude-sonnet-5-5
night_hours: 8
cycles: 5
sleep_onset: "23:00"        # on the evening before the night's date (night_id = wake date)
seed: 42

# --- LLM call settings ---
llm:
  max_tokens: 16000
  extract_effort: low       # extraction is a simple structured task
  narrate_effort: low
  visual_effort: low
  rate_effort: low
  concurrency: 6            # parallel LLM calls when narrating / rating a night
  # Sonnet 5.5 rejects non-default temperature (HTTP 400). When false, the stage
  # temperature is recorded in the trace and expressed as prompt guidance instead.
  send_temperature: false
  # Server-side refusal fallback ("default" routes by refusal category). null disables it.
  fallbacks: default

paths:
  db: data/memory.db
  day_logs: data/day_logs
  outputs: outputs/nights
  study: outputs/study

# --- ingest/ : day residue ---
ingest:
  extractor: llm            # llm | heuristic  (llm falls back to heuristic if no credentials)
  default_entry_time: "12:00"
  max_fragments_per_entry: 4   # LLM extractor only

# --- local embeddings ---
embedding:
  backend: sentence-transformers   # sentence-transformers | hashing
  model: all-MiniLM-L6-v2
  hashing_dim: 512                 # offline hashing backend (tests, no model download)
  hashing_ngram_weight: 0.3        # weight of character-trigram features vs whole words

# --- memory/emotion.py : amygdala salience heuristics ---
emotion:
  default_arousal: 0.3
  intensifier_boost: 0.15          # "very", "so", "!" raise arousal by this much
  negation_window: 3               # tokens after "not"/"never" that flip valence

# --- memory/replay.py : hippocampal replay sampler ---
replay:
  alpha: 1.0        # recency
  beta: 1.2         # arousal
  gamma: 0.8        # |valence|
  delta: 0.5        # novelty
  epsilon: 0.3      # replay_count penalty
  tau_days: 2
  old_memory_prob: 0.15
  old_memory_days: 30
  min_weight: 0.01  # floor so every fragment keeps a non-zero chance
  # Stage modulation of the coefficients: NREM favors recency, REM favors arousal.
  stage_multipliers:
    NREM: {alpha: 2.0, beta: 0.6, gamma: 0.8, delta: 0.5, epsilon: 1.0}
    REM:  {alpha: 0.6, beta: 1.8, gamma: 1.3, delta: 1.2, epsilon: 1.0}
  # REM associative chains: next fragment drawn from a *medium* cosine-distance band,
  # defined as quantiles of the distances from the current link to all candidates.
  rem_distance_quantiles: [0.15, 0.45]
  # NREM: after the first seed, stay close (episodic, same context).
  nrem_distance_quantiles: [0.0, 0.15]

# --- sleep/scheduler.py : night timeline ---
sleep:
  n1_minutes: 5                 # sleep onset, first cycle only
  rem_minutes: [10, 40]         # REM length, first -> last cycle (linear)
  n3_minutes: [40, 0]           # N3 length, first -> last cycle (slow-wave sleep fades)
  n2_split: 0.6                 # share of a cycle's N2 that comes before N3
  jitter_minutes: 3             # random +/- on each segment length
  rem_late_from_cycle: 3        # cycles >= this use the REM_late profile
  min_episode_minutes: 3        # a segment must be at least this long to host an episode

# --- stage profiles (spec §4.3) ---
# words: narrative length; augment: extra fragments retrieved by embedding noise;
# image_prompts: visual prompts per episode; temperature: nominal (see llm.send_temperature).
stages:
  N2:
    fragments: [1, 2]
    temperature: 0.6
    bizarre_ops: [0, 0]
    words: [40, 80]
    augment: 0
    image_prompts: [0, 0]
    style: "thought-like and mundane: ordinary activity, verbal thinking, little imagery"
  N3:
    fragments: [1, 1]
    temperature: 0.4
    bizarre_ops: [0, 0]
    words: [20, 40]
    augment: 0
    image_prompts: [0, 0]
    style: "fragmentary: a static image or a single thought, disconnected, barely narrative"
  REM_early:
    fragments: [3, 4]
    temperature: 0.9
    bizarre_ops: [1, 2]
    words: [150, 250]
    augment: 1
    image_prompts: [1, 2]
    style: "vivid and visual: rich sensory detail, especially visual, a scene that moves"
  REM_late:
    fragments: [4, 6]
    temperature: 1.0
    bizarre_ops: [2, 4]
    words: [250, 400]
    augment: 1
    image_prompts: [2, 3]
    style: "vivid, emotional and story-like: a plot that drifts, strong feeling, sensory immersion"

# --- noise/ : PGO bursts + overfitted-brain augmentation ---
noise:
  embedding_sigma: 0.15         # norm of the Gaussian perturbation of a unit embedding
  pgo_rate_per_min: 0.2         # Poisson rate over REM minutes
  pgo_max_events: 5             # cap per episode, so a 40-min REM stays narratable
  pgo_injection_prob: 0.4       # burst -> random fragment injection (else scene transition)

# --- noise/bizarre.py ---
bizarre:
  old_memory_days: 30           # time_distortion overlaps a fragment older than this with the present
  object_swap_prob: 0.5         # object_transformation: become another seed object (else a new category)
  prior_pgo_weight: 0.5         # structural prior: load = operators + w * PGO bursts
  prior_scale: 3.0              # prior = 1 - exp(-load / scale)

# --- synth/lucid.py (only with --lucid) ---
lucid:
  prob_late_rem: 0.5            # chance a REM_late episode turns partially lucid

# --- visual/ ---
visual:
  style: "dream-like composition, soft edges, impossible perspective, hazy light"

# --- eval/ ---
eval:
  nights: 20                    # nights generated by `dream study`
  rater_model: null             # bizarreness rater; null = same as `model`
  cv_folds: 5
  separability_target: 0.75

# --- eeg/ (phase 4): real sleep staging on Sleep-EDF ---
eeg:
  data_dir: data/eeg
  subjects: 10                  # Sleep-EDF Sleep Cassette subjects 0..N-1
  recordings: [1, 2]            # nights per subject
  eeg_channels: ["EEG Fpz-Cz", "EEG Pz-Oz"]
  eog_channel: "EOG horizontal"
  bandpass: [0.3, 35.0]         # Hz
  epoch_seconds: 30
  wake_margin_minutes: 30       # wake kept before the first / after the last sleep epoch
  bands:                        # Hz
    delta: [0.5, 4.0]
    theta: [4.0, 8.0]
    alpha: [8.0, 12.0]
    sigma: [12.0, 15.0]
    beta: [15.0, 30.0]
  spindle:
    band: [11.0, 16.0]
    rms_window_s: 0.3
    threshold_sd: 2.5           # envelope > mean + k·sd of the recording
    duration_s: [0.5, 2.0]
  context_epochs: 2             # features of ±k neighbouring epochs are appended
  cv_folds: 5                   # folds grouped by subject
  lightgbm:
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 20
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    class_weight: balanced
  accuracy_target: 0.75
  # hypnogram -> night
  smoothing_epochs: 3           # mode filter on epoch labels before building segments
  rem_cycle_gap_minutes: 15     # REM periods closer than this belong to the same cycle
  min_final_cycle_minutes: 30   # sleep after the last REM forms its own cycle only if this long

# --- video/ : dreams rendered as MP4 (scene images + subtitles + narration) ---
video:
  out_dir: outputs/video
  stages: [REM]                 # which episodes get a video by default (REM, N2, N3)
  backend: sd-turbo             # local, free; images cached by prompt
  model: stabilityai/sd-turbo
  weights_variant: fp16         # download the half-size weights (upcast to float32 on load)
  image_size: [768, 432]        # generation size (multiples of 8)
  steps: 1                      # SD-Turbo works in 1-4 steps
  frame_size: [1280, 720]
  fps: 24
  crf: 20                       # x264 quality (lower = better, larger)
  ken_burns_zoom: 0.12          # slow push-in per scene
  crossfade_s: 0.9              # between scenes, unless a PGO burst cuts hard
  flash_s: 0.3                  # white flash on a PGO cut
  title_s: 2.6
  tail_s: 1.6
  sentence_gap_s: 0.35          # pause between narrated sentences
  reading_wps: 2.6              # subtitle pace when narration is off
  subtitle_fade_s: 0.35
  subtitle_px: 38
  voice: "Microsoft Hazel Desktop"   # Windows speech voice; null = no narration
  voice_rate: -2                # -10 (slow) .. 10 (fast)
  font: "C:/Windows/Fonts/georgia.ttf"
  font_italic: "C:/Windows/Fonts/georgiai.ttf"
